<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zotero Whiteboard</title>
    <link
      rel="stylesheet"
      href="chrome://zoteromarkdown/content/whiteboard/whiteboard.css"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          "PingFang SC",
          "Hiragino Sans GB",
          "Microsoft YaHei",
          sans-serif;
      }
      #whiteboard-root,
      .zmd-board-host {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 0;
        box-sizing: border-box;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="whiteboard-root" tabindex="-1"></div>
    <script src="chrome://zoteromarkdown/content/whiteboard/whiteboard.js"></script>
  </body>
</html>
